name: Fetch publication thumbnails

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-publication-images.yml'
      - 'assets/files/publications_list.txt'

permissions:
  contents: write

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow pymupdf

      - name: Fetch representative images
        shell: bash
        run: |
          python <<'PY'
          import io, os, re, sys, time, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image, ImageOps

          PUB = Path('assets/files/publications_list.txt')
          OUT = Path('assets/images/publications')
          OUT.mkdir(parents=True, exist_ok=True)
          text = PUB.read_text(encoding='utf-8')

          entries = []
          current = None
          for line in text.splitlines():
              m = re.match(r'^\s*(\d+)\.\s*(.*)$', line)
              if m:
                  current = {'n': int(m.group(1)), 'citation': m.group(2), 'id': None}
                  entries.append(current)
                  continue
              m = re.match(r'^\s*Image ID:\s*(\S+)', line)
              if m and current:
                  current['id'] = m.group(1)

          S = requests.Session()
          S.headers.update({
              'User-Agent': 'Mozilla/5.0 (compatible; TuanAnhLeAcademicSite/1.0; +https://tuananhtbbk1986.github.io/)'
          })

          def get_title(c):
              m = re.search(r'"([^"]+)"', c)
              return m.group(1).strip() if m else ''

          def get_doi(c):
              m = re.search(r'https?://doi\.org/([^\s]+)', c, re.I)
              if m:
                  return m.group(1).rstrip('.,;')
              m = re.search(r'\b10\.\d{4,9}/[^\s]+', c)
              return m.group(0).rstrip('.,;') if m else None

          def crossref_doi(title):
              if not title: return None
              try:
                  r = S.get('https://api.crossref.org/works', params={'query.title': title, 'rows': 1}, timeout=20)
                  r.raise_for_status()
                  items = r.json()['message']['items']
                  if items:
                      return items[0].get('DOI')
              except Exception as e:
                  print('Crossref lookup failed:', title[:50], e)
              return None

          def openalex(doi):
              try:
                  u = 'https://api.openalex.org/works/' + urllib.parse.quote('https://doi.org/' + doi, safe=':/')
                  r = S.get(u, timeout=20)
                  if r.ok:
                      return r.json()
              except Exception as e:
                  print('OpenAlex failed:', doi, e)
              return None

          def score_img(url, alt=''):
              x = (url + ' ' + alt).lower()
              score = 0
              for key, val in [
                  ('graphical abstract', 90), ('graphical', 70), ('visual abstract', 70),
                  ('figure 1', 55), ('fig. 1', 55), ('fig1', 50), ('g001', 45),
                  ('fig01', 45), ('f1.', 35), ('cover', 25), ('article', 10)
              ]:
                  if key in x: score += val
              for bad in ['logo','icon','avatar','banner','advert','cookie','spinner','qr']:
                  if bad in x: score -= 100
              return score

          def html_candidates(url):
              out = []
              try:
                  r = S.get(url, timeout=25, allow_redirects=True)
                  if not r.ok or 'text/html' not in r.headers.get('content-type',''):
                      return out
                  soup = BeautifulSoup(r.text, 'html.parser')
                  for prop in ['og:image','twitter:image','twitter:image:src']:
                      for tag in soup.find_all('meta', attrs={'property': prop}) + soup.find_all('meta', attrs={'name': prop}):
                          u = tag.get('content')
                          if u:
                              out.append((score_img(u, prop)+20, urllib.parse.urljoin(r.url, u)))
                  for fig in soup.find_all('figure'):
                      img = fig.find('img')
                      if not img: continue
                      u = img.get('src') or img.get('data-src') or img.get('data-original')
                      if not u: continue
                      alt = (img.get('alt') or '') + ' ' + fig.get_text(' ', strip=True)[:200]
                      out.append((score_img(u, alt)+40, urllib.parse.urljoin(r.url, u)))
                  for img in soup.find_all('img')[:120]:
                      u = img.get('src') or img.get('data-src') or img.get('data-original')
                      if not u: continue
                      alt = img.get('alt') or ''
                      out.append((score_img(u, alt), urllib.parse.urljoin(r.url, u)))
              except Exception as e:
                  print('HTML parse failed:', url, e)
              seen = set(); result=[]
              for s,u in sorted(out, reverse=True):
                  if u not in seen and u.startswith('http'):
                      seen.add(u); result.append((s,u))
              return result

          def download_image(url):
              try:
                  r = S.get(url, timeout=30, allow_redirects=True, headers={'Referer': url})
                  if not r.ok or len(r.content) < 3000:
                      return None
                  im = Image.open(io.BytesIO(r.content))
                  im.load()
                  if im.width < 220 or im.height < 140:
                      return None
                  if im.mode not in ('RGB','L'):
                      bg = Image.new('RGB', im.size, 'white')
                      if 'A' in im.getbands(): bg.paste(im, mask=im.getchannel('A'))
                      else: bg.paste(im.convert('RGB'))
                      im = bg
                  else:
                      im = im.convert('RGB')
                  im.thumbnail((900, 700), Image.Resampling.LANCZOS)
                  canvas = Image.new('RGB', (900, 600), 'white')
                  fitted = ImageOps.contain(im, (880, 580), Image.Resampling.LANCZOS)
                  canvas.paste(fitted, ((900-fitted.width)//2, (600-fitted.height)//2))
                  return canvas
              except Exception:
                  return None

          def pdf_first_page(pdf_url):
              try:
                  import fitz
                  r = S.get(pdf_url, timeout=45, allow_redirects=True)
                  if not r.ok or not r.content.startswith(b'%PDF'):
                      return None
                  doc = fitz.open(stream=r.content, filetype='pdf')
                  page = doc[0]
                  pix = page.get_pixmap(matrix=fitz.Matrix(1.3,1.3), alpha=False)
                  im = Image.open(io.BytesIO(pix.tobytes('png'))).convert('RGB')
                  im.thumbnail((900,700), Image.Resampling.LANCZOS)
                  canvas = Image.new('RGB',(900,600),'white')
                  fitted=ImageOps.contain(im,(880,580),Image.Resampling.LANCZOS)
                  canvas.paste(fitted,((900-fitted.width)//2,(600-fitted.height)//2))
                  return canvas
              except Exception as e:
                  print('PDF fallback failed:', e)
                  return None

          made = 0
          for e in entries:
              if not e['id']:
                  continue
              dest = OUT / f"{e['id']}.jpg"
              if dest.exists() and dest.stat().st_size > 5000:
                  print('exists', dest)
                  continue
              title = get_title(e['citation'])
              doi = get_doi(e['citation']) or crossref_doi(title)
              if not doi:
                  print('No DOI:', e['n'], title)
                  continue
              print(f"[{e['n']}] {doi} :: {title}")
              oa = openalex(doi) or {}
              pages = []
              pdfs = []
              for loc_key in ['best_oa_location','primary_location']:
                  loc = oa.get(loc_key) or {}
                  if loc.get('landing_page_url'): pages.append(loc['landing_page_url'])
                  if loc.get('pdf_url'): pdfs.append(loc['pdf_url'])
              pages.append('https://doi.org/' + doi)

              candidates=[]
              for p in dict.fromkeys(pages):
                  candidates.extend(html_candidates(p))
              im = None
              chosen = None
              for score,u in sorted(candidates, reverse=True)[:25]:
                  im = download_image(u)
                  if im is not None:
                      chosen = u
                      break
              if im is None:
                  for p in dict.fromkeys(pdfs):
                      im = pdf_first_page(p)
                      if im is not None:
                          chosen = p + ' [PDF page 1]'
                          break
              if im is None:
                  print('  no usable open image found')
                  continue
              im.save(dest, 'JPEG', quality=84, optimize=True)
              print('  saved', dest, 'from', chosen)
              made += 1
              time.sleep(0.5)

          print('Created', made, 'new thumbnails')
          PY

      - name: Commit thumbnails
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/publications/
          if git diff --cached --quiet; then
            echo "No new thumbnails"
            exit 0
          fi
          git commit -m "Add publication thumbnails"
          git push
